<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Somyaaaaa's Emergency Cheer-Up Station 💖</title>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#f9a8d4"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Somyaaaaa's Station"/>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');

  *{box-sizing:border-box;margin:0;padding:0;}

  body{
    font-family:'Nunito',sans-serif;
    min-height:100vh;
    background:linear-gradient(135deg,#fce4ec 0%,#f3e5f5 35%,#e8eaf6 70%,#fce4ec 100%);
    background-size:400% 400%;
    animation:bgShift 10s ease infinite;
    display:flex;flex-direction:column;align-items:center;
    padding:20px 16px 40px;
    overflow-x:hidden;
  }

  @keyframes bgShift{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
  }

  /* ── floating stars ── */
  .star{position:fixed;pointer-events:none;font-size:1.2rem;animation:floatStar linear infinite;opacity:0.4;}
  @keyframes floatStar{0%{transform:translateY(100vh) rotate(0deg);opacity:0.4}100%{transform:translateY(-10vh) rotate(360deg);opacity:0}}

  /* ── header ── */
  .header{text-align:center;margin-bottom:28px;}
  .header h1{
    font-size:clamp(1.6rem,5vw,2.4rem);
    font-weight:900;
    background:linear-gradient(90deg,#e91e8c,#9c27b0,#e91e8c);
    background-size:200%;
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    animation:shimmer 3s linear infinite;
  }
  @keyframes shimmer{0%{background-position:0%}100%{background-position:200%}}
  .header .sub{font-size:0.95rem;color:#9c27b0;margin-top:6px;font-weight:600;}
  .header .heart{font-size:1.4rem;animation:heartbeat 1.2s ease infinite;}
  @keyframes heartbeat{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}

  /* ── machine body ── */
  .machine{
    background:linear-gradient(160deg,#fff0f8 0%,#f5e6ff 100%);
    border:3px solid #f48fb1;
    border-radius:28px;
    padding:24px 20px;
    width:100%;max-width:420px;
    box-shadow:0 8px 40px rgba(233,30,140,0.15),0 2px 8px rgba(0,0,0,0.08);
    position:relative;
  }

  .machine-top{
    background:linear-gradient(135deg,#f06292,#ce93d8);
    border-radius:16px;
    padding:14px 16px;
    text-align:center;
    margin-bottom:20px;
    color:#fff;
    font-weight:800;
    font-size:1.05rem;
    letter-spacing:1px;
    box-shadow:0 4px 12px rgba(240,98,146,0.4);
  }
  .machine-top span{font-size:1.5rem;}

  /* ── slot display ── */
  .slot-display{
    background:#1a0a2e;
    border:3px solid #ce93d8;
    border-radius:12px;
    min-height:80px;
    display:flex;align-items:center;justify-content:center;
    margin-bottom:20px;
    font-size:0.85rem;color:#ce93d8;
    font-weight:700;letter-spacing:2px;
    text-transform:uppercase;
    overflow:hidden;
    position:relative;
  }
  .slot-display .capsule-fall{
    position:absolute;top:-80px;
    animation:dropCapsule 0.6s cubic-bezier(.36,.07,.19,.97) forwards;
  }
  @keyframes dropCapsule{
    0%{top:-80px;opacity:1}
    70%{top:10px}
    85%{top:0px}
    100%{top:5px;opacity:1}
  }
  .capsule-emoji{font-size:3rem;display:block;text-align:center;}

  /* ── mood buttons ── */
  .moods-label{font-size:0.8rem;color:#9c27b0;text-align:center;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:12px;}

  .moods-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;}

  .mood-btn{
    background:linear-gradient(135deg,#fff,#fce4ec);
    border:2.5px solid #f48fb1;
    border-radius:16px;
    padding:16px 10px;
    cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:6px;
    font-family:'Nunito',sans-serif;
    font-weight:800;font-size:0.9rem;color:#880e4f;
    transition:all 0.2s ease;
    box-shadow:0 3px 8px rgba(240,98,146,0.15);
    -webkit-tap-highlight-color:transparent;
  }
  .mood-btn:hover,.mood-btn:active{
    transform:translateY(-3px) scale(1.04);
    box-shadow:0 8px 20px rgba(240,98,146,0.35);
    border-color:#e91e8c;
  }
  .mood-btn .emoji{font-size:2rem;}
  .mood-btn .label{font-size:0.78rem;}

  /* ── dispense btn ── */
  .dispense-wrap{text-align:center;margin-bottom:4px;}
  .dispense-btn{
    background:linear-gradient(135deg,#e91e8c,#9c27b0);
    color:#fff;
    border:none;border-radius:50px;
    padding:14px 40px;
    font-family:'Nunito',sans-serif;
    font-size:1rem;font-weight:900;
    cursor:pointer;letter-spacing:1px;
    box-shadow:0 6px 20px rgba(233,30,140,0.4);
    transition:all 0.2s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .dispense-btn:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(233,30,140,0.5);}
  .dispense-btn:disabled{opacity:0.5;cursor:not-allowed;transform:none;}

  /* ── overlay modal ── */
  .overlay{
    position:fixed;inset:0;
    background:rgba(10,0,25,0.75);
    display:flex;align-items:center;justify-content:center;
    z-index:100;padding:20px;
    animation:fadeIn 0.3s ease;
    backdrop-filter:blur(4px);
  }
  .overlay.hidden{display:none;}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}

  .card{
    background:linear-gradient(160deg,#fff9fb,#f3e5f5);
    border:3px solid #f48fb1;
    border-radius:24px;
    padding:30px 24px;
    max-width:360px;width:100%;
    text-align:center;
    box-shadow:0 20px 60px rgba(233,30,140,0.3);
    animation:popIn 0.4s cubic-bezier(.175,.885,.32,1.275);
    position:relative;
  }
  @keyframes popIn{from{transform:scale(0.5);opacity:0}to{transform:scale(1);opacity:1}}

  .card .big-emoji{font-size:3.5rem;margin-bottom:10px;}
  .card .mood-name{font-size:0.75rem;text-transform:uppercase;letter-spacing:3px;color:#9c27b0;font-weight:700;margin-bottom:8px;}
  .card .message{font-size:1rem;font-weight:700;color:#4a0e4e;line-height:1.6;margin-bottom:18px;}

  .coupon{
    background:linear-gradient(135deg,#fce4ec,#f3e5f5);
    border:2px dashed #f48fb1;
    border-radius:14px;
    padding:14px 16px;
    margin-bottom:18px;
  }
  .coupon .coupon-title{font-size:0.7rem;text-transform:uppercase;letter-spacing:2px;color:#e91e8c;font-weight:800;margin-bottom:6px;}
  .coupon .coupon-text{font-size:0.95rem;font-weight:800;color:#880e4f;}

  .close-btn{
    background:linear-gradient(135deg,#e91e8c,#9c27b0);
    color:#fff;border:none;border-radius:50px;
    padding:12px 32px;font-family:'Nunito',sans-serif;
    font-size:0.95rem;font-weight:800;cursor:pointer;
    box-shadow:0 4px 16px rgba(233,30,140,0.4);
    -webkit-tap-highlight-color:transparent;
  }

  /* ── confetti ── */
  .confetti-piece{
    position:fixed;width:10px;height:10px;
    pointer-events:none;z-index:200;
    animation:confettiFall linear forwards;
    border-radius:2px;
  }
  @keyframes confettiFall{
    0%{transform:translateY(-10px) rotate(0deg);opacity:1}
    100%{transform:translateY(100vh) rotate(720deg);opacity:0}
  }

  /* ── footer ── */
  .footer{margin-top:24px;text-align:center;font-size:0.8rem;color:#9c27b0;font-weight:600;}
  .footer span{animation:heartbeat 1.2s ease infinite;display:inline-block;}
</style>
</head>
<body>

<!-- Floating stars -->
<div id="stars"></div>

<div class="header">
  <div class="heart">💖</div>
  <h1>Somyaaaaa's<br/>Emergency Cheer-Up Station</h1>
  <div class="sub">Powered with 💖 by Cheesyyy</div>
</div>

<div class="machine">
  <div class="machine-top">
    <span>🎀</span> MOOD VENDING MACHINE <span>🎀</span>
  </div>

  <div class="slot-display" id="slotDisplay">
    <span style="color:#ce93d8;font-size:0.75rem;letter-spacing:2px;">SELECT YOUR MOOD ↓</span>
  </div>

  <div class="moods-label">— How are you feeling? —</div>

  <div class="moods-grid">
    <button class="mood-btn" onclick="selectMood('stressed')">
      <span class="emoji">😫</span>
      <span>Stressed</span>
      <span class="label">overwhelmed?</span>
    </button>
    <button class="mood-btn" onclick="selectMood('sad')">
      <span class="emoji">🥺</span>
      <span>Sad / Low</span>
      <span class="label">need a hug?</span>
    </button>
    <button class="mood-btn" onclick="selectMood('tired')">
      <span class="emoji">🥱</span>
      <span>Tired</span>
      <span class="label">drained?</span>
    </button>
    <button class="mood-btn" onclick="selectMood('bored')">
      <span class="emoji">🤪</span>
      <span>Bored</span>
      <span class="label">need chaos?</span>
    </button>
  </div>

  <div class="dispense-wrap">
    <button class="dispense-btn" id="dispenseBtn" onclick="dispense()" disabled>
      🎰 Dispense My Fix!
    </button>
  </div>
</div>

<div class="footer">Made with <span>💖</span> just for you, Somyaaaaa</div>

<!-- Result overlay -->
<div class="overlay hidden" id="overlay">
  <div class="card" id="card">
    <div class="big-emoji" id="cardEmoji"></div>
    <div class="mood-name" id="cardMoodName"></div>
    <div class="message" id="cardMessage"></div>
    <div class="coupon">
      <div class="coupon-title">🎫 Your Exclusive Coupon</div>
      <div class="coupon-text" id="cardCoupon"></div>
    </div>
    <button class="close-btn" onclick="closeCard()">Redeem Later 🌸</button>
  </div>
</div>

<script>
const MOODS = {
  stressed: {
    emoji: '😫',
    name: 'STRESSED',
    capsule: '🟣',
    message: "Hey Somyaaaaa 💜 Stop. Breathe. You are literally doing SO MUCH and you don't even give yourself credit for it. Whatever is stressing you out — it will pass. Cheesyyy believes in you more than you know. You've survived 100% of your bad days so far. This one too. 💪✨",
    coupon: '🍫 1x Chocolate Delivery — On Cheesyyy\'s tab, no questions asked!'
  },
  sad: {
    emoji: '🥺',
    name: 'SAD / LOW',
    capsule: '🔵',
    message: "Somyaaaaa 🌸 It's okay to feel sad. You don't have to pretend you're fine. Cheesyyy is literally just one call away — always. Whenever you need a voice, a laugh, or just silence together — pick up and dial. You are never, ever alone in this. 💙",
    coupon: '📞 1x Unlimited Call with Cheesyyy — Talk as long as you need, anytime 💙'
  },
  tired: {
    emoji: '🥱',
    name: 'TIRED',
    capsule: '🟡',
    message: "Somyaaaaa, rest is not laziness — it's self-love! 🌙 You've been working so hard and your body is literally asking you for a break. Curl up. Nap. Do nothing. You deserve all the rest in the world. Cheesyyy's orders: guilt-free chill mode — activated! ☕✨",
    coupon: '☕ 1x Iced Coffee / Boba — Cheesyyy\'s treat at the next meet!'
  },
  bored: {
    emoji: '🤪',
    name: 'BORED',
    capsule: '🟢',
    message: "CHAOS TIME, Somyaaaaa! 🎉 Boredom is just the universe telling you it's time for an adventure. And guess what? Cheesyyy is the official certified chaos coordinator. Movie? Snacks? Absolutely unhinged plans? We've got it all. Let's GO! 🎬🍿",
    coupon: '🎬 1x Movie Night of Your Choice — Cheesyyy brings ALL the snacks!'
  }
};

let selectedMood = null;

function selectMood(mood) {
  selectedMood = mood;
  const data = MOODS[mood];

  // Play chime
  playChime();

  // Update slot display
  const slot = document.getElementById('slotDisplay');
  slot.innerHTML = `<div class="capsule-fall"><span class="capsule-emoji">${data.emoji}</span></div>`;
  setTimeout(() => {
    // Replace animation element to allow re-trigger
  }, 700);

  // Enable button
  const btn = document.getElementById('dispenseBtn');
  btn.disabled = false;
  btn.style.animation = 'heartbeat 0.6s ease 2';
}

function dispense() {
  if (!selectedMood) return;
  const data = MOODS[selectedMood];

  document.getElementById('cardEmoji').textContent = data.emoji;
  document.getElementById('cardMoodName').textContent = data.name;
  document.getElementById('cardMessage').textContent = data.message;
  document.getElementById('cardCoupon').textContent = data.coupon;

  document.getElementById('overlay').classList.remove('hidden');
  launchConfetti();
  playChime(true);
}

function closeCard() {
  document.getElementById('overlay').classList.add('hidden');
  selectedMood = null;
  document.getElementById('dispenseBtn').disabled = true;
  document.getElementById('slotDisplay').innerHTML = '<span style="color:#ce93d8;font-size:0.75rem;letter-spacing:2px;">SELECT YOUR MOOD ↓</span>';
}

function playChime(big = false) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const notes = big ? [523, 659, 784, 1047] : [523, 659];
    notes.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = freq;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0.3, ctx.currentTime + i * 0.15);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.15 + 0.4);
      osc.start(ctx.currentTime + i * 0.15);
      osc.stop(ctx.currentTime + i * 0.15 + 0.4);
    });
  } catch(e) {}
}

function launchConfetti() {
  const colors = ['#f48fb1','#ce93d8','#80deea','#fff59d','#a5d6a7','#e91e8c','#9c27b0'];
  for (let i = 0; i < 80; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.cssText = `
      left:${Math.random()*100}vw;
      top:-10px;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      width:${6+Math.random()*8}px;
      height:${6+Math.random()*8}px;
      border-radius:${Math.random()>0.5?'50%':'2px'};
      animation-duration:${1.5+Math.random()*2}s;
      animation-delay:${Math.random()*0.5}s;
    `;
    document.body.appendChild(piece);
    setTimeout(() => piece.remove(), 4000);
  }
}

// Floating stars
(function() {
  const container = document.getElementById('stars');
  const emojis = ['⭐','✨','🌸','💫','🌟','💕','🎀','🌙'];
  for (let i = 0; i < 12; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    s.style.cssText = `left:${Math.random()*100}vw;animation-duration:${8+Math.random()*12}s;animation-delay:${Math.random()*10}s;font-size:${0.8+Math.random()*0.8}rem;`;
    container.appendChild(s);
  }
})();
</script>
</body>
</html>
